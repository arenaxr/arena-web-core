name: Release to Docker Hub

on:
    release:
        types:
            - published

    schedule:
        - cron: '0 1 * * *' # every day publish a new 'latest'

    workflow_dispatch:

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Login to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: 'Set up QEMU'
              uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

            - name: 'Set up Docker Buildx'
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Get release
              id: get_release
              uses: bruceadams/get-release@3a8733307b85cd96d52772b037617bd63d99522e # v1.2.3
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: Build and push Docker image
              id: docker_build
              uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v5.1.0
              with:
                  platforms: linux/amd64,linux/arm64
                  build-args: |
                      chash=${{ github.sha }}
                      version=${{ steps.get_release.outputs.tag_name || 'latest' }}
                  push: true
                  tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.get_release.outputs.tag_name || 'latest' }}, ${{ secrets.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}:latest

            - name: Image digest
              run: echo ${{ steps.docker_build.outputs.digest }}
