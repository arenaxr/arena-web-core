name: Release to Docker Hub

on:
    release:
        types:
            - published

    schedule:
        - cron: '0 1 * * *' # every day publish a new 'latest'

    workflow_dispatch:

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Login to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: 'Set up QEMU'
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: 'Set up Docker Buildx'
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Get release
              id: get_release
              uses: bruceadams/get-release@74c3d60f5a28f358ccf241a00c9021ea16f0569f # v1.3.2
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: Build and push Docker image
              id: docker_build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  platforms: linux/amd64,linux/arm64
                  build-args: |
                      chash=${{ github.sha }}
                      version=${{ steps.get_release.outputs.tag_name || 'latest' }}
                  push: true
                  tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.get_release.outputs.tag_name || 'latest' }}, ${{ secrets.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}:latest

            - name: Image digest
              run: echo ${{ steps.docker_build.outputs.digest }}
