name: Release to Docker Hub

on:
    release:
        types:
            - published

    schedule:
        - cron: '0 1 * * *' # every day publish a new 'latest'

    workflow_dispatch:

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Login to Docker Hub
              uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1.14.1
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

            - name: Checkout code
              uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
              with:
                  fetch-depth: 0

            - name: 'Set up QEMU'
              uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.0.0

            - name: 'Set up Docker Buildx'
              uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

            - name: Get release
              id: get_release
              uses: bruceadams/get-release@3a8733307b85cd96d52772b037617bd63d99522e # v1.2.3
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: Build and push Docker image
              id: docker_build
              uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v5.1.0
              with:
                  platforms: linux/amd64,linux/arm64
                  build-args: |
                      chash=${{ github.sha }}
                      version=${{ steps.get_release.outputs.tag_name || 'latest' }}
                  push: true
                  tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.get_release.outputs.tag_name || 'latest' }}, ${{ secrets.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}:latest

            - name: Image digest
              run: echo ${{ steps.docker_build.outputs.digest }}
